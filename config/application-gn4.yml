geonetwork:
  4:
    url: ${GN4_BASE_URL:http://localhost:8080/geonetwork}
    path: >
      /srv,
      /static/,
      /images/,
      /catalog/,
      /map/,
      /criticalhealthcheck,
      /warninghealthcheck,
      /jolokia,
      /xml/,
      /index/,
      /doc/api/index.html,
      /doc/api/swagger-ui.css,
      /doc/api/swagger-ui-bundle.js,
      /doc/api/swagger-ui-standalone-preset.js
    # Path fragments GN5 owns exclusively; never proxied to GN4 even if nested under one of the
    # paths above (e.g. a client-side relative-URL bug resolving "/srv/api/user/signout").
    excluded-path: >
      /api/user/
